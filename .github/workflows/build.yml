name: Build Dopamine Rootless Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C ~/theos/sdks --strip-components=1

      - name: Build Rootless .deb for Dopamine (iOS 16.4)
        env:
          THEOS: /Users/runner/theos
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.n1ck.wifiusage-rootless-deb
          path: packages/*.deb

