name: Build and Deploy Sileo Repo to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Theos & Dependencies
        run: |
          brew install ldid dpkg zstd
          pip3 install zstandard || true
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C ~/theos/sdks --strip-components=1

      - name: Build Rootless .deb
        env:
          THEOS: /Users/runner/theos
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.n1ck.wifiusage-rootless-deb
          path: packages/*.deb

      - name: Generate Sileo Repository
        run: |
          python3 scripts/generate_repo.py

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo_dist
          publish_branch: gh-pages
          force_orphan: true
