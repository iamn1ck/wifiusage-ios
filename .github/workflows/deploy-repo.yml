name: Build and Deploy Sileo Repo to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Theos & Dependencies
        run: |
          brew install ldid dpkg zstd
          pip3 install zstandard || true
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C ~/theos/sdks --strip-components=1

      - name: Build Rootless .deb
        env:
          THEOS: /Users/runner/theos
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.n1ck.wifiusage-rootless-deb
          path: packages/*.deb

      - name: Prepare Repo Files for GitHub Pages
        run: |
          mkdir -p repo_dist/debs
          cp packages/*.deb repo_dist/debs/

          # Disable Jekyll so GitHub Pages serves raw files like Release and Packages
          touch repo_dist/.nojekyll

          # Copy repo metadata
          cat << 'EOF' > repo_dist/Release
Origin: n1ck
Label: n1ck's Repo
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm64 iphoneos-arm64e
Components: main
Description: Sileo & APT repository for WiFiUsage
EOF

          # Generate web preview page
          cat << 'EOF' > repo_dist/index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>n1ck's Repo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 1.75rem; color: #38bdf8; }
    p { color: #94a3b8; line-height: 1.6; }
    .btn {
      display: block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 8px;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn.sileo { background: #3b82f6; }
    .btn.zebra { background: #10b981; }
    code {
      display: block;
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      margin: 15px 0;
      font-size: 0.85rem;
      color: #cbd5e1;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>n1ck's Repo</h1>
    <p>Official Sileo & APT repository for <strong>WiFiUsage</strong> (iOS 16 Dopamine rootless).</p>
    <code>https://iamn1ck.github.io/wifiusage-ios/</code>
    <a class="btn sileo" href="sileo://source/https://iamn1ck.github.io/wifiusage-ios/">Add to Sileo</a>
    <a class="btn zebra" href="zbra://sources/add/https://iamn1ck.github.io/wifiusage-ios/">Add to Zebra</a>
  </div>
</body>
</html>
EOF

          # Run the repo indexer inside repo_dist
          cd repo_dist
          python3 ../scripts/generate_repo.py
          cd ..
        working-directory: ${{ github.workspace }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo_dist
          publish_branch: gh-pages
          force_orphan: true
